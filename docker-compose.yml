services:
  ollama:
    image: ollama/ollama@sha256:76d0c003b27db65170e88ab319ff19c9bcee41ecb8177c52ab06921dfa13abdf
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama@sha256:76d0c003b27db65170e88ab319ff19c9bcee41ecb8177c52ab06921dfa13abdf
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        ensure_model() {
          local base="$$1" variant="$$1-ctx16k"
          if ollama show "$$variant" > /dev/null 2>&1; then
            echo "[ollama-init] $$variant already present"
          else
            echo "[ollama-init] Pulling $$base ..."
            ollama pull "$$base"
            echo "[ollama-init] Creating $$variant (16K context) ..."
            printf 'FROM %s\nPARAMETER num_ctx 16384\n' "$$base" > /tmp/Modelfile
            ollama create "$$variant" -f /tmp/Modelfile
            echo "[ollama-init] $$variant ready"
          fi
        }
        ensure_model qwen3:8b
        ensure_model llama3-groq-tool-use:8b
        ensure_model llama3.1:8b
        echo "[ollama-init] All models available"
    restart: "no"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  mcp-gateway:
    image: debian:bookworm-slim@sha256:56ff6d36d4eb3db13a741b342ec466f121480b5edded42e4b7ee850ce7a418ee
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/wsl/docker-desktop/cli-tools/usr/bin/docker:/usr/bin/docker:ro
      - /mnt/wsl/docker-desktop/cli-tools/usr/local/lib/docker/cli-plugins/docker-mcp:/usr/local/lib/docker/cli-plugins/docker-mcp:ro
      - ${DOCKER_MCP_CONFIG}:/root/.docker/mcp:ro
      - /mnt/wsl/docker-desktop/shared-sockets/host-services:/run/host-services
      - /mnt/wsl/docker-desktop/shared-sockets/guest-services/jfs.sock:/run/host-services/jfs.sock
    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN}
    entrypoint:
      [
        "/usr/bin/docker", "mcp", "gateway", "run",
        "--transport", "sse",
        "--port", "8808"
      ]
    ports:
      - "127.0.0.1:8808:8808"
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8808'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      mcp-gateway:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OLLAMA_HOST: http://ollama:11434
      # Twitch tokens loaded from ~/.openclaw/.env via loadDotEnv() — not passed here
      # so the onRefresh callback can update them at runtime.
      # No Anthropic/Claude keys: every model is local Ollama (agents.defaults.modelPolicy.allow).
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      OBS_WS_HOST: ${OBS_WS_HOST:-host.docker.internal}
      OBS_WS_PORT: ${OBS_WS_PORT:-4455}
      OBS_WS_PASSWORD: ${OBS_WS_PASSWORD}
      OBS_LAUNCHER_TOKEN: ${OBS_LAUNCHER_TOKEN}
      RENDERER_TOKEN: ${RENDERER_TOKEN}
      OBS_LAUNCHER_URL: ${OBS_LAUNCHER_URL:-http://host.docker.internal:8100}
      OBS_MEDIA_SOURCE: ${OBS_MEDIA_SOURCE:-EpisodeVideo}
      OBS_PLAYBACK_SCENE: ${OBS_PLAYBACK_SCENE:-Episode Playback}
      OBS_RENDERS_WIN_PREFIX: ${OBS_RENDERS_WIN_PREFIX}
      OBS_STREAM_KEY: ${OBS_STREAM_KEY}
      OBS_STARTING_SCENE: ${OBS_STARTING_SCENE:-Starting Soon}
      OBS_STARTING_DURATION: ${OBS_STARTING_DURATION:-120}
      OBS_INTRO_SCENE: ${OBS_INTRO_SCENE:-Stream Intro}
      OBS_INTRO_SOURCE: ${OBS_INTRO_SOURCE:-IntroVideo}
      OBS_OUTRO_SCENE: ${OBS_OUTRO_SCENE:-Starting Soon}
      OBS_OUTRO_DURATION: ${OBS_OUTRO_DURATION:-30}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/clawd
      - ${TWITCH_WORKSPACE_DIR}:/home/node/clawd-twitch
      - ${BUSINESS_DEV_REPO}:/home/node/repos/SpokeToWork---Business-Development:ro
      - ${TRANSCRIPTS_REPO}:/home/node/repos/TranScripts:ro
      - ${TRADING_DATA_DIR}:/home/node/repos/Trading
      - ./toolkit:/app/toolkit:ro
      - ${OPENCLAW_CONFIG_DIR}/logs:/tmp/openclaw
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend
      - default
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    # Upstream's own check (docker-compose.yml at v2026.9.9). The official image has no /health route.
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}"
      ]

  remotion-renderer:
    build:
      context: ./remotion
      dockerfile: Dockerfile
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      REMOTION_DIR: /app
      RENDERS_DIR: /renders
      RENDERER_TOKEN: ${RENDERER_TOKEN}
    volumes:
      - ${TWITCH_WORKSPACE_DIR}/renders:/renders
      - ${TWITCH_WORKSPACE_DIR}/renders/_audio:/app/public/_audio
      - ./toolkit:/app/toolkit:ro
      - ${OPENCLAW_CONFIG_DIR}/rpg:/home/node/.openclaw/rpg:ro
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/clawd
      - ${TWITCH_WORKSPACE_DIR}:/home/node/clawd-twitch
      - ${BUSINESS_DEV_REPO}:/home/node/repos/SpokeToWork---Business-Development:ro
      - ${TRANSCRIPTS_REPO}:/home/node/repos/TranScripts:ro
      - ${TRADING_DATA_DIR}:/home/node/repos/Trading
      - ./toolkit:/app/toolkit:ro
    stdin_open: true
    tty: true
    init: true
    networks:
      - default
    entrypoint: ["node", "dist/index.js"]

networks:
  backend:

volumes:
  ollama-data:
